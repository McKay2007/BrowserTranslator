<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReadMate PDF</title>
    <link rel="stylesheet" href="viewer.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="brand">ReadMate PDF</span>
      <button id="openBtn" type="button">打开 PDF</button>
      <input id="fileInput" type="file" accept="application/pdf,.pdf" hidden />
      <label class="word-completion" title="自动补齐选词末尾漏选的 1–2 个字母；选取单词的一部分时可关闭。">
        <input id="completeWords" type="checkbox" checked />补齐词尾
      </label>
      <span id="status"></span>
    </header>
    <main id="viewer"></main>
    <script src="pdf-selection.js"></script>
    <script src="content.js"></script>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
