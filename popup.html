<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ReadMate PDF 设置</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="brand">
      <span class="brand-mark">译</span>
      <div>
        <h1>ReadMate PDF</h1>
        <p>划词翻译 · PDF</p>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="settings" type="button">设置</button>
      <button class="tab" data-view="vocab" type="button">
        生词本 <span id="vocabCount" class="count" hidden></span>
      </button>
    </nav>

    <button id="openPdf" class="pdf-link" type="button">翻译 PDF 文件</button>

    <main id="settingsView">
      <label class="field">
        <span>翻译引擎</span>
        <select id="engine">
          <option value="auto">自动（推荐）</option>
          <option value="youdao">有道翻译</option>
          <option value="google">Google 翻译</option>
          <option value="mymemory">MyMemory</option>
          <option value="custom">自定义大模型接口</option>
        </select>
      </label>

      <label class="field">
        <span>目标语言</span>
        <select id="targetLang">
          <option value="zh-CN">中文（简体）</option>
          <option value="zh-TW">中文（繁体）</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="ru">Русский</option>
          <option value="pt">Português</option>
          <option value="it">Italiano</option>
          <option value="vi">Tiếng Việt</option>
          <option value="th">ไทย</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="ar">العربية</option>
        </select>
      </label>

      <label class="field inline">
        <input type="checkbox" id="autoLookup" />
        <span>双击单词自动翻译</span>
      </label>

      <section id="customSection" hidden>
        <h2>自定义接口</h2>
        <label class="field">
          <span>接口地址</span>
          <input type="text" id="customEndpoint" spellcheck="false"
                 placeholder="https://api.deepseek.com/chat/completions" />
        </label>
        <label class="field">
          <span>模型名称</span>
          <input type="text" id="customModel" spellcheck="false" placeholder="deepseek-chat" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input type="password" id="customKey" spellcheck="false" placeholder="sk-..." />
        </label>
        <p class="hint">兼容 OpenAI 格式，DeepSeek / OpenAI / Moonshot 等均可。</p>
      </section>
    </main>

    <section id="vocabView" hidden>
      <div class="vocab-toolbar">
        <input type="text" id="vocabSearch" placeholder="搜索生词…" spellcheck="false" />
        <button id="vocabClear" type="button">清空</button>
      </div>
      <ul id="vocabList"></ul>
      <p id="vocabEmpty" class="empty" hidden>还没有收藏的生词</p>
    </section>

    <footer id="settingsFooter">
      <span id="status"></span>
      <button id="save" type="button">保存</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
